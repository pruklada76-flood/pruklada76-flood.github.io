name: fetch data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions: {}   # nothing by default; the job below asks only for what it needs
concurrency:
  group: fetch-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # commit data/*.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch.py
      - name: commit if changed
        run: |
          git config user.name "village-flood-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: auto update"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
